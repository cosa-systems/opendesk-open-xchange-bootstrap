---
apiVersion: "rbac.authorization.k8s.io/v1"
kind: "Role"
metadata:
  namespace: {{ .Release.Namespace | quote }}
  name: {{ include "common.names.fullname" . | quote }}
rules:
  # needed to execute commands inside pod
  - apiGroups: [""]
    resources:
      - "pods"
    resourceNames: [{{ .Values.coreMiddleware.pod | quote }}]
    verbs: ["get"]
  - apiGroups: [""]
    resources:
      - "pods/exec"
    resourceNames: [{{ .Values.coreMiddleware.pod | quote }}]
    verbs: ["create"]
  # needed to restart stateful set
  - apiGroups: ["apps"]
    resources:
      - "statefulsets"
    resourceNames: [{{ .Values.coreMiddleware.statefulSet | quote }}]
    verbs: ["get", "patch"]
...
