---
apiVersion: "rbac.authorization.k8s.io/v1"
kind: "Role"
metadata:
  namespace: {{ .Release.Namespace | quote }}
  name: {{ include "common.names.fullname" . | quote }}
rules:
  # needed to execute commands inside pod
  - apiGroups: [""]
    resources:
      - "pods"
    verbs: ["get", "list"]
  - apiGroups: [""]
    resources:
      - "pods/exec"
    verbs: ["create"]
  # needed to restart stateful set
  - apiGroups: ["apps"]
    resources:
      - "deployments"
      - "statefulsets"
    verbs: ["get", "list", "patch"]
...
